<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>角色與技能圖鑑</title>
<style>
body{margin:0;background:#102039;color:#f5f8ff;font-family:system-ui,"Noto Sans TC",sans-serif}
header{padding:20px max(16px,5vw);background:#18335d;position:sticky;top:0;z-index:3}
header h1{font-size:20px;margin:0 0 6px} header p{font-size:12px;margin:0;color:#d6e5ff}
a{color:#b9eaff} main{padding:16px;max-width:1200px;margin:auto}
section{margin:0 0 28px} h2{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
figure{margin:0;padding:10px;border:1px solid #6c90b27c;border-radius:12px;background:#30445c}
figure img{width:100%;height:180px;object-fit:contain;background:repeating-conic-gradient(#fbfbfb 0 25%,#e9edf1 0 50%) 50%/20px 20px;border-radius:7px}
figcaption{font-size:12px;word-break:break-word;line-height:1.45;padding-top:8px}
.storm{position:relative;height:410px;max-width:540px;margin:auto;background:radial-gradient(circle,#4b8ac577,#203854 64%);border-radius:24px}
.storm img{position:absolute;object-fit:contain;width:25%;height:35%}
.storm .front{top:1%;left:37.5%}.storm .right{top:31%;right:2%}
.storm .back{bottom:1%;left:37.5%}.storm .left{top:31%;left:2%}
.storm b{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);font-size:14px}
.storm small{position:absolute;bottom:8px;left:0;right:0;text-align:center}
#fan-notice{position:fixed;z-index:4;bottom:calc(4px + env(safe-area-inset-bottom));left:calc(6px + env(safe-area-inset-left));padding:2px 4px;border-radius:4px;background:#0a1c38cc;color:#edf5ff;font-size:9px;pointer-events:none}
</style></head><body><header><h1>角色與技能圖鑑</h1><p>收錄主角、技能與各關卡怪物圖片。</p><a href="./">返回遊戲</a></header><main>
<section><h2>藍色風暴：四方同時出現</h2><div class="storm"><b>主角</b><img class="front" src="./assets/sprites/blue_storm_front.png" alt="前"><img class="right" src="./assets/sprites/blue_storm_right.png" alt="右"><img class="back" src="./assets/sprites/blue_storm_back.png" alt="後"><img class="left" src="./assets/sprites/blue_storm_left.png" alt="左"><small>前 (1) · 右 (2) · 後 (3) · 左 (4)</small></div></section>
<div id="contents"></div></main>
<script>
const groups={
 '主角與氣功':['player_base_sheet','player_base_idle','player_base_move','player_base_jump','player_base_crouch','player_base_roll','player_ki_charge','player_ki_beam'],
 '變身與其他技能':['player_transform_sheet','player_transform_idle','player_transform_jump','player_transform_crouch','player_transform_roll','transform_five_color_magic','transform_absolute_defense','transform_meteor_rain','super_lightning_blue','super_lightning_gold'],
 '第一至五關怪物':['slime','goblin_boss','wolf','tiger_boss','ghost','zombie_boss','orc','cyclops_boss','red_dragon_boss'],
 '隱藏關怪物與 Boss':['wyvern_red','wyvern_blue','wyvern_gold','wyvern_purple','wyvern_green','final_boss_baseball','final_boss_demon','final_boss_dark_flame']
};
const root=document.querySelector('#contents');
for(const [title,names] of Object.entries(groups)){
 const section=document.createElement('section'); const heading=document.createElement('h2');heading.textContent=title;section.append(heading);
 const grid=document.createElement('div');grid.className='grid';
 for(const name of names){const fig=document.createElement('figure');const img=document.createElement('img');img.loading='lazy';img.alt=name;img.src=`./assets/sprites/${name}.png`;const caption=document.createElement('figcaption');caption.textContent=`${name}.png`;fig.append(img,caption);grid.append(fig)}
 section.append(grid);root.append(section);
}
</script><small id="fan-notice">粉絲自製非營利作品，僅供同好交流</small></body></html>
